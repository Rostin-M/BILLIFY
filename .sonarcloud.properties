# Configuración del Análisis Automático de SonarCloud (proyecto Rostin-M_BILLIFY).
# sonar-project.properties solo lo usa el scanner local (docker-compose.sonar.yml);
# el Análisis Automático de SonarCloud únicamente lee este archivo.

sonar.sources=src,prisma,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.d.ts,**/dist/**,public/**,**/generated/**,prisma/migrations/**

sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**/*.test.mjs
