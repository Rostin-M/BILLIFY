sonar.projectKey=billify
sonar.projectName=BILLIFY
sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=src,prisma,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.d.ts,**/dist/**,public/**,**/generated/**,prisma/migrations/**

# Tests (los de src se identifican por sufijo; tests/ contiene los de integración)
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**/*.test.mjs
sonar.test.exclusions=**/node_modules/**

# Cobertura (reporte LCOV generado por el runner de tests)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fuera de la métrica de cobertura (se siguen analizando por bugs y code smells):
#  - componentes visuales, páginas y layouts de React (*.tsx en src/app) y PDFs
#  - cableado del framework: cliente tRPC, handler de NextAuth, manifest
#  - scripts operativos de una sola ejecución
# La lógica de esas carpetas que no es visual (.ts) sí cuenta: rutas /api, hooks,
# nav-config, settings/types, sessionExpiryActions.
sonar.coverage.exclusions=\
  src/app/**/*.tsx,\
  src/lib/pdf/**,\
  src/trpc/**,\
  src/app/manifest.ts,\
  src/app/api/auth/**,\
  src/server/auth/index.ts,\
  src/server/auth/config.ts,\
  src/server/lib/generateFacturaPdf.tsx,\
  scripts/**

sonar.javascript.node.maxspace=4096
